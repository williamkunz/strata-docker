# Builds the image from the Strata tag in build/STRATA_VERSION on every push (merge) to main, and
# pushes ghcr.io/williamkunz/strata:<tag> and :latest.
name: Build image

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360          # the hosted-runner maximum; the engine compiles for five GPU generations
    steps:
      - uses: actions/checkout@v4

      - name: Template matches the pinned Strata version
        run: |
          tag=$(tr -d '[:space:]' < build/STRATA_VERSION)
          grep -q "<Repository>ghcr.io/williamkunz/strata:${tag}</Repository>" strata.xml || {
            echo "::error file=strata.xml::<Repository> must be ghcr.io/williamkunz/strata:${tag} to match build/STRATA_VERSION"
            exit 1
          }

      # the CUDA devel base image plus the build need more than the runner's ~14 GB free
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build${{ github.event_name == 'push' && ' and push' || '' }}
        env:
          PUSH: ${{ github.event_name == 'push' && '1' || '0' }}
        run: bash build/build.sh
